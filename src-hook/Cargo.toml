[package]
name = "hook"
version = "1.8.7"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["overlay"]
# In-game ImGui overlay drawn through a DX11 Present hook.
overlay = ["dep:hudhook"]
console = []
damage-debug = []
identity-debug = []

[package.metadata.winres]
OriginalFilename = "hook.dll"
CompanyName = "ChickenSeller"
LegalCopyright = "Copyright (C) 2026 ChickenSeller; based on GBFR Logs Awa Edition by onelittlechildawa and GBFR Logs by False Spring"

[dependencies]
anyhow = "1.0"
ctor = "0.2.6"
dirs = "5.0"
fern = { version = "0.6" }
interprocess = { version = "^2.0", features = ["tokio"] }
log = "0.4"
pelite = "0.10.0"
retour = { version = "0.3.1", features = ["static-detour"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
windows = { version = "0.52.0", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs"] }
futures = "0.3"
protocol = { path = "../protocol" }
tokio-util = { version = "0.7.11", features = ["codec"] }
# 0.8.3 is the newest release that builds with the pinned nightly-2024-05-04 (0.9 needs rustc 1.85).
hudhook = { version = "=0.8.3", default-features = false, features = ["dx11"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[build-dependencies]
winres = "0.1"
